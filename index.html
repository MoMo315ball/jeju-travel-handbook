<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>济州岛旅行手册</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8e2d6;color:#234638;font:16px/1.55 system-ui,sans-serif}
main{max-width:460px;min-height:100vh;margin:auto;background:#fcf8ee;padding:18px 24px 30px}
h1,h2,p{margin:0}h1{font-size:26px;line-height:1.25;font-weight:800}h2{color:#93451d;font-size:21px;margin:18px 0 10px}
input,select,button{font:inherit;color:inherit}button{cursor:pointer;border:0;background:transparent;padding:0}
#status{color:#93451d}#status:empty{display:none}#login .dates{color:#93451d;font-weight:800;font-size:16px}
.orange{width:106px;height:106px;border-radius:50%;background:#eca24b;margin:27px auto 22px;position:relative}
.orange:after{content:"";position:absolute;right:0;top:-9px;width:45px;height:22px;border-radius:16px;background:#456650}
#login h1{font-size:43px;margin-bottom:27px}
#login label{display:block;font-weight:700;margin-bottom:6px}
#login select,#login input{display:block;width:100%;border:0;border-radius:8px;background:#eee6d6;padding:11px 14px;margin:0 0 13px}
#login button{width:100%;background:#244f3e;color:white;border-radius:9px;font-weight:800;padding:12px;margin:8px 0 18px}
.account{margin:4px 0 16px;font-size:15px}.account button{text-decoration:underline;text-underline-offset:3px}
nav{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:18px}
nav a{border-radius:6px;background:#f1e8d6;color:inherit;text-decoration:none;text-align:center;padding:6px 0;font-size:14px;font-weight:800;white-space:nowrap}
nav a:first-child{font-size:12px;align-content:center}nav a[aria-current]{background:#244f3e;color:white}
section h1{font-size:34px;margin-bottom:12px}section p{margin:7px 0}
#shared form,#personal form{display:flex;gap:8px;border-radius:9px;background:#f2ead7;margin:12px 0 16px;padding:10px 14px}
form input:not([type=password]){flex:1;min-width:0;border:none;background:transparent}form button{font-weight:800}
article{margin:0 0 12px;background:#f5eddb;border-radius:9px;padding:10px 14px}
article .toggle{display:block;font-size:17px;font-weight:800;text-align:left}
article small{display:block;color:#536454;margin:6px 0 2px 19px}
article small button{margin-left:7px}#personal article{background:transparent;padding:0 0 2px;margin:0 0 4px}
#personal article .toggle{font-weight:500}#personal article small{margin-top:0}#personal form{margin-top:18px}
#personal h2{margin-top:23px}details{margin-top:24px}summary{cursor:pointer}
[hidden]{display:none!important}
</style><main><p id="status" role="status"></p>
<form id="login"><p class="dates">JEJU · 27 NOV — 01 DEC</p><div class="orange" aria-hidden="true"></div>
<h1>济州岛<br>旅行手册</h1><label for="member">选你的名字</label><select id="member" name="member_name"><option>球球<option>妹妹<option>子辰<option>若涵</select>
<input name="invite_code" aria-label="邀请码" placeholder="输入邀请码" required type="password" autocomplete="current-password">
<button>打开手册</button></form>
<div id="handbook" hidden><p class="account"><span id="visitor"></span> · <button id="logout">退出</button></p><div id="pages"></div></div>
</main><script src="config.js"></script><script src="app.js?v=3"></script></html>
